; Minimal clean template for subconverter / SubConverter-Extended.
; Goal: keep the generated Clash.Meta / Mihomo config as light as possible.
; No external rule providers, no media groups, no regional groups, no preset route bundles.
; Conservative single-selector edition: keep only PROXY + DIRECT, remove REJECT.

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; One core selector only. All converted nodes are placed under PROXY.
custom_proxy_group=PROXY`select`[]DIRECT`.*

; Keep routing minimal: everything falls through to the PROXY selector.
ruleset=PROXY,[]FINAL